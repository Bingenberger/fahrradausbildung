# nginx vor der Fahrradprüfung (Beispiel). Nach /etc/nginx/sites-available/ kopieren,
# Domain und Zertifikatspfade anpassen, verlinken, `nginx -t && systemctl reload nginx`.

# Kein Pfad im Zugriffsprotokoll: Posten-Adressen (/p/…, /api/p/…) enthalten das
# Zugangs-Token, und Tokens dürfen nicht ins Log (Spezifikation 9).
log_format fahrrad_ohne_pfad '$remote_addr [$time_local] "$request_method" $status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name fahrrad.example.org;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fahrrad.example.org;

    ssl_certificate     /etc/letsencrypt/live/fahrrad.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fahrrad.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/fahrrad-access.log fahrrad_ohne_pfad;
    # Fehlermeldungen von nginx enthalten die Anfragezeile. „crit" hält Alltagsfehler
    # (z. B. App kurz nicht erreichbar) und damit Token-Pfade aus dem Log.
    error_log /var/log/nginx/fahrrad-error.log crit;

    # Uploads der Posten: höchstens 2 MB (die App prüft das selbst noch einmal).
    client_max_body_size 3m;

    # Sicherheits-Header (CSP, HSTS, nosniff …) setzt die Anwendung selbst –
    # hier nicht doppelt setzen.

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Bewusst $remote_addr statt $proxy_add_x_forwarded_for: Ein vom Client
        # mitgeschickter X-Forwarded-For-Header wird überschrieben, nicht verlängert.
        # Sonst könnte jemand die Anmeldebremse mit erfundenen IPs umgehen.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # Sammel-PDF einer großen Gruppe
    }
}
