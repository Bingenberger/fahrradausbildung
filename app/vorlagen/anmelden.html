{% extends "basis.html" %}
{% block titel %}Anmelden{% endblock %}
{% block inhalt %}
<section class="karte schmal">
  <h1>Anmelden</h1>
  <p class="hilfe">Verwaltung der Radfahrausbildung. Die Zugangsdaten bekommst du von der Schulleitung.</p>
  {% if fehler %}
    <p class="meldung meldung-fehler" role="alert">{{ symbol("warning-circle") }}<span>{{ fehler }}</span></p>
  {% endif %}
  <form method="post" action="/anmelden" class="formular">
    <input type="hidden" name="csrf" value="{{ anmelde_csrf }}">
    <label>E-Mail-Adresse
      <input type="email" name="email" autocomplete="username" required autofocus>
    </label>
    <label>Passwort
      <input type="password" name="passwort" autocomplete="current-password" required>
    </label>
    <button type="submit" class="knopf knopf-haupt">{{ symbol("sign-in") }} Anmelden</button>
  </form>
</section>
{% endblock %}
